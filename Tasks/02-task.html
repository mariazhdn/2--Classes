<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 02</title>
</head>

<body>

    <div id="cylinder"></div>

    <script>
        /*
        Задание:
        Определите класс цилиндр, который будет объектным представлением геометрического тела.
        Класс должен содержать конструктор.
        Конструктор должен принимать два параметра высота и радиус и инициализировать соответствующие свойства.
        В классе должен быть определен метод getVolume, который должен возвращать значение объема данного цилиндра.
        Создайте два экземпляра данного класса, передав произвольные значения в качестве параметров конструктора и выведите
        на консоль значения объема двух экземпляров.
        */

        class Cylinder
        {
            #height;
            #radius;
            constructor(height, radius)
            {
                this.#height = height;
                this.#radius = radius;
            }

            getVolume()
            {
                const P = 3.14;
                return P * (this.#radius * this.#radius) * this.#height;
            }

            showInfo() 
            {
                let output = document.getElementById("cylinder");
                output.innerHTML += "Volume: " + this.getVolume() + "<br>";
            }

            get height() {
                return this.#height;
            }

            set height(value) {
                this.#height = value;
            }

            get radius() {
                return this.#radius;
            }

            set radius(value) {
                this.#radius = value;
            }
        }

        let cyl1 = new Cylinder(3, 9);
        let cyl2 = new Cylinder(2, 4);
        cyl1.showInfo();
        cyl2.showInfo();
    </script>
</body>

</html>
